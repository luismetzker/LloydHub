<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GodsTech - Área Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #0b0e14;
      color: #00ffcc;
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }

    .admin-container {
      max-width: 1400px;
      width: 100%;
      background: rgba(0, 20, 20, 0.9);
      padding: 35px 30px;
      border-radius: 16px;
      border: 1px solid #00ffcc55;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2.2rem;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc0088;
      letter-spacing: 2px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
      border-bottom: 1px solid #00ffcc33;
      padding-bottom: 20px;
    }

    .logout-btn {
      background: #cc3333;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: 0.2s;
    }

    .logout-btn:hover {
      background: #ff4444;
      transform: scale(1.02);
    }

    #loginSection {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      text-align: center;
    }

    #loginSection label {
      color: #aaffdd;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #loginSection input {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      background: #0f1a1a;
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #ccffee;
      font-size: 1rem;
      outline: none;
      margin-bottom: 15px;
    }

    #loginSection input:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 15px #00ffcc44;
    }

    #loginSection .btn-login {
      background: linear-gradient(135deg, #00ccaa, #008877);
      border: none;
      padding: 12px 40px;
      border-radius: 8px;
      color: #0b0e14;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    #loginSection .btn-login:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ffcc88;
    }

    .error-msg {
      color: #ff6666;
      margin-top: 10px;
      min-height: 1.5rem;
    }

    #dataSection {
      display: none;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
      padding: 15px;
      background: #0f1a1a;
      border-radius: 8px;
      border: 1px solid #00ffcc33;
    }

    .stats-bar .stats {
      color: #88bbaa;
      font-size: 0.9rem;
    }

    .stats-bar .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-copy-all {
      background: #1a3a3a;
      border: 1px solid #00ffcc66;
      color: #ccffee;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn-copy-all:hover {
      background: #00ffcc44;
      border-color: #00ffcc;
    }

    .btn-refresh {
      background: #1a3a3a;
      border: 1px solid #00ffcc66;
      color: #ccffee;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .btn-refresh:hover {
      background: #00ffcc44;
      border-color: #00ffcc;
    }

    .table-wrap {
      overflow-x: auto;
      background: #0f1a1a;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #00ffcc44;
      margin-top: 10px;
      max-height: 70vh;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      color: #ccffee;
      font-size: 0.9rem;
      min-width: 800px;
    }

    th {
      background: #1a2a2a;
      color: #00ffcc;
      padding: 12px 10px;
      text-align: left;
      border-bottom: 2px solid #00ffcc66;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #00ffcc22;
      vertical-align: top;
      max-width: 400px;
      word-wrap: break-word;
      word-break: break-all;
    }

    td .content-cell {
      max-width: 500px;
      white-space: pre-wrap;
      word-wrap: break-word;
      word-break: break-all;
      font-size: 0.85rem;
      line-height: 1.4;
      background: #0a1212;
      padding: 8px;
      border-radius: 4px;
      border-left: 2px solid #00ffcc44;
      max-height: 150px;
      overflow-y: auto;
    }

    td .content-cell.expanded {
      max-height: none;
    }

    td .btn-toggle {
      background: transparent;
      border: 1px solid #00ffcc44;
      color: #88bbaa;
      padding: 2px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.7rem;
      margin-top: 4px;
      transition: 0.2s;
    }

    td .btn-toggle:hover {
      background: #00ffcc22;
      border-color: #00ffcc;
    }

    td .copy-btn {
      background: #1a3a3a;
      border: 1px solid #00ffcc66;
      color: #ccffee;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
      margin: 2px;
      white-space: nowrap;
    }

    td .copy-btn:hover {
      background: #00ffcc44;
      border-color: #00ffcc;
    }

    td .copy-btn.copied {
      background: #00aa77;
      border-color: #00ffcc;
    }

    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #88bbaa;
      font-size: 1.1rem;
    }

    .badge {
      display: inline-block;
      background: #00ffcc22;
      color: #00ffcc;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      border: 1px solid #00ffcc44;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0b0e14;
      border: 1px solid #00ffcc66;
      border-radius: 12px;
      padding: 30px;
      max-width: 800px;
      width: 100%;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #00ffcc33;
      padding-bottom: 10px;
    }

    .modal-header h3 {
      color: #00ffcc;
    }

    .modal-close {
      background: #cc3333;
      border: none;
      color: white;
      padding: 5px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    .modal-close:hover {
      background: #ff4444;
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
      background: #0a1212;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #00ffcc22;
    }

    .modal-body pre {
      color: #ccffee;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      word-break: break-all;
      line-height: 1.6;
      margin: 0;
    }

    .modal-footer {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-footer .btn-copy-modal {
      background: #00ccaa;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      color: #0b0e14;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .modal-footer .btn-copy-modal:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ffcc88;
    }

    @media (max-width: 768px) {
      .admin-container {
        padding: 20px 15px;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      td .content-cell {
        max-width: 200px;
        font-size: 0.75rem;
      }
      
      .stats-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>

<div class="admin-container" id="adminContainer">
  <div class="admin-header">
    <h1>🛡️ GodsTech · Área Restrita</h1>
    <button class="logout-btn" id="logoutBtn" style="display:none;">Sair</button>
  </div>

  <div id="loginSection">
    <label for="secretPassword">🔑 Digite a chave de acesso</label>
    <input type="password" id="secretPassword" placeholder="Código secreto..." />
    <button class="btn-login" id="loginBtn">Acessar</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <div id="dataSection">
    <div class="stats-bar">
      <div class="stats" id="statsDisplay">📊 Carregando...</div>
      <div class="actions">
        <button class="btn-copy-all" id="copyAllBtn">📋 Copiar Todos os Dados</button>
        <button class="btn-refresh" id="refreshBtn">🔄 Atualizar</button>
      </div>
    </div>
    <div class="table-wrap" id="tableWrapper">
      <div class="empty-msg">Carregando dados...</div>
    </div>
  </div>
</div>

<!-- Modal para visualização completa -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">📄 Conteúdo Completo</h3>
      <button class="modal-close" id="modalClose">✕ Fechar</button>
    </div>
    <div class="modal-body" id="modalBody">
      <pre id="modalText"></pre>
    </div>
    <div class="modal-footer">
      <button class="btn-copy-modal" id="modalCopyBtn">📋 Copiar Conteúdo</button>
    </div>
  </div>
</div>

<script>
  // ===== DOM =====
  const loginSection = document.getElementById('loginSection');
  const dataSection = document.getElementById('dataSection');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const secretInput = document.getElementById('secretPassword');
  const loginError = document.getElementById('loginError');
  const tableWrapper = document.getElementById('tableWrapper');
  const statsDisplay = document.getElementById('statsDisplay');
  const refreshBtn = document.getElementById('refreshBtn');
  const copyAllBtn = document.getElementById('copyAllBtn');
  
  // Modal
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');
  const modalBody = document.getElementById('modalBody');
  const modalText = document.getElementById('modalText');
  const modalTitle = document.getElementById('modalTitle');
  const modalCopyBtn = document.getElementById('modalCopyBtn');

  let currentData = [];

  // ===== FUNÇÕES =====

  async function checkAuth() {
    try {
      const res = await fetch('/api/check-auth');
      const data = await res.json();
      if (data.authenticated) {
        showDataSection();
      } else {
        showLoginSection();
      }
    } catch (err) {
      console.error(err);
      showLoginSection();
    }
  }

  function showLoginSection() {
    loginSection.style.display = 'flex';
    dataSection.style.display = 'none';
    logoutBtn.style.display = 'none';
    loginError.textContent = '';
  }

  function showDataSection() {
    loginSection.style.display = 'none';
    dataSection.style.display = 'block';
    logoutBtn.style.display = 'inline-block';
    loadData();
  }

  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    try {
      return new Date(dateStr).toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    } catch {
      return dateStr;
    }
  }

  function showModal(title, content) {
    modalTitle.textContent = title;
    modalText.textContent = content;
    modalOverlay.classList.add('active');
    
    // Guardar o conteúdo para copiar
    modalCopyBtn.dataset.content = content;
  }

  function hideModal() {
    modalOverlay.classList.remove('active');
  }

  // ===== LOGIN =====

  loginBtn.addEventListener('click', async () => {
    const password = secretInput.value.trim();
    if (!password) {
      loginError.textContent = 'Digite a senha.';
      return;
    }

    try {
      const res = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();

      if (data.success) {
        showDataSection();
        loginError.textContent = '';
        secretInput.value = '';
      } else {
        loginError.textContent = '❌ Senha incorreta. Tente novamente.';
      }
    } catch (err) {
      loginError.textContent = 'Erro de conexão.';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    try {
      await fetch('/api/admin-logout', { method: 'POST' });
      showLoginSection();
    } catch (err) {
      alert('Erro ao sair.');
    }
  });

  secretInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginBtn.click();
  });

  // ===== MODAL =====

  modalClose.addEventListener('click', hideModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) hideModal();
  });

  modalCopyBtn.addEventListener('click', () => {
    const content = modalCopyBtn.dataset.content || '';
    navigator.clipboard.writeText(content).then(() => {
      const original = modalCopyBtn.textContent;
      modalCopyBtn.textContent = '✅ Copiado!';
      setTimeout(() => { modalCopyBtn.textContent = original; }, 2000);
    }).catch(() => {
      alert('Não foi possível copiar.');
    });
  });

  // ===== CARREGAR DADOS =====

  async function loadData() {
    try {
      const res = await fetch('/api/data');
      if (res.status === 401) {
        showLoginSection();
        return;
      }
      currentData = await res.json();

      // Atualizar estatísticas
      statsDisplay.textContent = `📊 Total de registros: ${currentData.length}`;

      if (currentData.length === 0) {
        tableWrapper.innerHTML = `<div class="empty-msg">📭 Nenhum dado enviado ainda.</div>`;
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th style="width:50px;">#</th>
              <th style="width:150px;">👤 Usuário</th>
              <th>🔑 Conteúdo</th>
              <th style="width:180px;">📅 Data</th>
              <th style="width:200px;">Ações</th>
            </tr>
          </thead>
          <tbody>
      `;

      currentData.forEach((row, index) => {
        const date = formatDate(row.created_at);
        const contentPreview = row.content.length > 100 ? row.content.substring(0, 100) + '...' : row.content;
        const isLong = row.content.length > 100;
        
        html += `
          <tr>
            <td><span class="badge">${index + 1}</span></td>
            <td><strong>${escapeHtml(row.username)}</strong></td>
            <td>
              <div class="content-cell" id="content-${row.id}">
                ${escapeHtml(contentPreview)}
              </div>
              ${isLong ? `<button class="btn-toggle" onclick="toggleContent(${row.id})">📖 Ver mais</button>` : ''}
            </td>
            <td style="font-size:0.8rem;color:#88bbaa;">${date}</td>
            <td>
              <button class="copy-btn" data-copy="${escapeHtml(row.username)}">📋 User</button>
              <button class="copy-btn" data-copy="${escapeHtml(row.content)}">📋 Conteúdo</button>
              <button class="copy-btn" onclick="viewFullContent(${row.id})">👁️ Ver tudo</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      tableWrapper.innerHTML = html;

      // Adicionar eventos de cópia
      document.querySelectorAll('.copy-btn[data-copy]').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = btn.getAttribute('data-copy');
          navigator.clipboard.writeText(text).then(() => {
            const original = btn.textContent;
            btn.textContent = '✅ Copiado!';
            btn.classList.add('copied');
            setTimeout(() => { 
              btn.textContent = original;
              btn.classList.remove('copied');
            }, 2000);
          }).catch(() => {
            alert('Não foi possível copiar.');
          });
        });
      });

    } catch (err) {
      console.error(err);
      tableWrapper.innerHTML = `<div class="empty-msg">❌ Erro ao carregar dados.</div>`;
    }
  }

  // ===== FUNÇÕES GLOBAIS (usadas no onclick) =====

  window.toggleContent = function(id) {
    const cell = document.getElementById(`content-${id}`);
    if (!cell) return;
    
    const row = currentData.find(r => r.id === id);
    if (!row) return;
    
    if (cell.classList.contains('expanded')) {
      cell.textContent = row.content.length > 100 ? row.content.substring(0, 100) + '...' : row.content;
      cell.classList.remove('expanded');
      cell.parentElement.querySelector('.btn-toggle').textContent = '📖 Ver mais';
    } else {
      cell.textContent = row.content;
      cell.classList.add('expanded');
      cell.parentElement.querySelector('.btn-toggle').textContent = '📖 Ver menos';
    }
  };

  window.viewFullContent = function(id) {
    const row = currentData.find(r => r.id === id);
    if (!row) return;
    
    showModal(
      `📄 Conteúdo Completo - Usuário: ${row.username}`,
      row.content
    );
  };

  // ===== BOTÃO COPIAR TUDO =====

  copyAllBtn.addEventListener('click', async () => {
    if (currentData.length === 0) {
      alert('Não há dados para copiar.');
      return;
    }

    // Formatar todos os dados
    let text = '=== DADOS DO DESCRIPTOGRAFADOR ===\n\n';
    text += `Total de registros: ${currentData.length}\n`;
    text += '='.repeat(50) + '\n\n';
    
    currentData.forEach((row, index) => {
      text += `[${index + 1}] USUÁRIO: ${row.username}\n`;
      text += `    CONTEÚDO: ${row.content}\n`;
      text += `    DATA: ${formatDate(row.created_at)}\n`;
      text += '-'.repeat(40) + '\n\n';
    });

    try {
      await navigator.clipboard.writeText(text);
      const original = copyAllBtn.textContent;
      copyAllBtn.textContent = '✅ Todos copiados!';
      setTimeout(() => { copyAllBtn.textContent = original; }, 3000);
    } catch (err) {
      alert('Erro ao copiar. Tente selecionar manualmente.');
    }
  });

  // ===== BOTÃO ATUALIZAR =====

  refreshBtn.addEventListener('click', () => {
    loadData();
  });

  // ===== INICIALIZAR =====

  checkAuth();

  // Auto-refresh a cada 30 segundos (opcional)
  // setInterval(loadData, 30000);
</script>
</body>
</html>
